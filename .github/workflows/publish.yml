name: Publish

# Runs on every merge to main, but only uploads when __version__ is not on PyPI yet.
# A merge that doesn't bump the version runs the tests and uploads nothing.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml

  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      is_new: ${{ steps.check.outputs.is_new }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check whether this version is already on PyPI
        id: check
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/media_cloud_mcp/__init__.py)
          if [ -z "$version" ]; then
            echo "::error::Could not read __version__"
            exit 1
          fi
          status=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/media-cloud-mcp/$version/json")
          case "$status" in
            200) is_new=false; echo "::notice::$version is already on PyPI, so nothing will be uploaded." ;;
            404) is_new=true ;;
            *) echo "::error::Unexpected HTTP $status from PyPI"; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "is_new=$is_new" >> "$GITHUB_OUTPUT"

  publish:
    needs: [test, check-version]
    if: needs.check-version.outputs.is_new == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/media-cloud-mcp/${{ needs.check-version.outputs.version }}/
    permissions:
      contents: read
      id-token: write # lets GitHub prove its identity to PyPI, so no token is stored
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv build
      - run: uv publish --trusted-publishing always
